aid: lilith-games
name: Lilith Games
description: 'Lilith Games (上海莉莉丝网络科技有限公司) is a Shanghai-headquartered video game developer
  and publisher founded in 2013, known for globally distributed mobile and PC titles including Rise of
  Kingdoms (万国觉醒), AFK Arena (剑与远征), AFK Journey (剑与远征：启程), Farlight 84 (远光84), Warpath (战火勋章),
  Art of Conquest (剑与家园) and a portfolio of indie games. The company operates as a consumer game
  publisher rather than an API platform: it publishes no public developer portal, API documentation, or
  partner API program. Its public engineering surface is the LilithGames GitHub organization, which
  open-sources backend and build infrastructure (Go networking and reverse-proxy tooling, build caching,
  Perforce virtual file system work) rather than client SDKs for a Lilith API. Surfaced as a portfolio
  company of IDG Capital.'
